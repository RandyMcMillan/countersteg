name: Deploy WASM demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --workspace

      - name: Build WASM module
        run: cargo build --release -p countersteg-wasm --target wasm32-unknown-unknown

      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js _site/
          cp target/wasm32-unknown-unknown/release/countersteg_wasm.wasm _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
